<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Peluche en Realidad Aumentada</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      body { margin: 0; background: #fafafa; }
      model-viewer { width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <model-viewer
      src="peluche.glb"
      alt="Un peluche en realidad aumentada"
      ar
      ar-modes="scene-viewer webxr quick-look"
      camera-controls
      auto-rotate
    ></model-viewer>
  </body>
</html>
